name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Decide whether this change touches code. Documentation-only changes
  # (README, docs/**, licenses) skip the heavy Rust matrix; the CI Gate job
  # below still reports success so branch protection is satisfied instantly.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'crates/**'
              - 'benches/**'
              - 'tests/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.github/workflows/**'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-default
            os: ubuntu-latest
            command: cargo test --locked
            net_tests: "0"
          - name: macos-lib
            os: macos-14
            command: cargo test --locked --lib
            net_tests: "0"
          - name: yara-engine
            os: ubuntu-latest
            command: cargo test --locked -p nab-yara-engine
            net_tests: "0"
          - name: task-feature
            os: ubuntu-latest
            command: cargo test --locked --features task --lib --bin nab task
            net_tests: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: ${{ matrix.command }}
        env:
          NAB_NET_TESTS: ${{ matrix.net_tests }}

  build:
    name: Build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-binaries
            command: cargo build --locked --bins
          - name: minimal-cli-http3
            command: cargo build --locked --bin nab --no-default-features --features cli,http3
          - name: mcp-binary
            command: cargo build --locked --bin nab-mcp --no-default-features
          - name: mcp-task
            command: cargo build --locked --bin nab-mcp --features task
          - name: mcp-task-browser
            command: cargo build --locked --bin nab-mcp --features task,browser
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: ${{ matrix.command }}

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo publish --locked --dry-run

  # Secret scanning always runs — a documentation change can still leak a key.
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@9b6b5326bfe25dbd856eccc8a8275eb5dea7bd52 # main
        with:
          extra_args: --only-verified

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.0
      - name: Run cargo audit
        run: cargo audit

  # License-boundary enforcement always runs: a PR can add a new EE file
  # needing the PolyForm-NC SPDX header without changing any Rust code.
  # Fast, no build.
  license-boundary:
    name: License boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate MIT / PolyForm-NC boundary
        run: python3 scripts/check_license_boundary.py

  # Single required status check. Passes when every upstream job either
  # succeeded or was skipped (documentation-only change); fails if any
  # upstream job failed or was cancelled. Make THIS the required check in
  # branch protection instead of the individual matrix jobs.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, fmt, clippy, test, build, package, secrets-scan, audit, license-boundary]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: ${results}"
          for r in ${results}; do
            case "${r}" in
              failure|cancelled)
                echo "::error::A CI job reported '${r}' — gate fails."
                exit 1
                ;;
            esac
          done
          echo "CI Gate passed (all jobs succeeded or were skipped)."
