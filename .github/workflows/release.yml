name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Release backstop for the dependency-vulnerability gate. ci.yml's `audit`
  # job runs `cargo audit` on every PR/push to main, but ci.yml does NOT run on
  # tags — so a `v*` tag push would otherwise reach the GitHub release and the
  # crates.io publish with zero vulnerability scanning. This job scans Cargo.lock
  # against OSV/RustSec at tag time and fails the release on any known fixable
  # vuln. It is BROADER than the PR-path `cargo audit`, which by default treats
  # unsound/unmaintained/yanked advisories as warnings (exit 0); osv-scanner
  # blocks on any fixable advisory. The `build` job (and the whole build ->
  # release -> publish DAG that `needs:`-es it) depends on this gate, so the
  # GitHub release and the crates.io publish both block if a fixable vuln is
  # present. Accepted/unfixable vulns are time-boxed in .github/osv-scanner.toml.
  security-gate:
    name: Security gate (block release on known vulns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Cargo.toml version matches the tag
        # Guards against tagging a release whose Cargo.toml was not bumped: that
        # ships mis-versioned binaries and fails `cargo publish` with a
        # "version already exists" error (regression: v0.12.0 tag vs 0.11.0 Cargo.toml).
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Release tag v$tag does not match Cargo.toml version $ver. Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "version OK: tag v$tag == Cargo.toml $ver"
          # Same drift guard for server.json (MCP registry metadata): a stale
          # repo copy misleads anyone reading the file, even though
          # publish-mcp-registry re-stamps the exact version from the tag at
          # publish time regardless of what's checked in.
          server_ver="$(jq -r '.version' server.json)"
          if [ "$server_ver" != "$ver" ]; then
            echo "::error::server.json version $server_ver does not match Cargo.toml version $ver. Bump server.json before tagging."
            exit 1
          fi
          cargo_pkg_ver="$(jq -r '.packages[] | select(.registryType == "cargo") | .version' server.json)"
          if [ "$cargo_pkg_ver" != "$ver" ]; then
            echo "::error::server.json cargo package version $cargo_pkg_ver does not match Cargo.toml version $ver."
            exit 1
          fi
          echo "server.json OK: matches Cargo.toml $ver"
          # The MCP registry rejects a description over 100 characters (422 on
          # body.description), and that publish runs last, after crates.io.
          # Checking here fails the tag before anything irreversible happens.
          desc_len="$(jq -r '.description | length' server.json)"
          if [ "$desc_len" -gt 100 ]; then
            echo "::error::server.json description is $desc_len characters; the MCP registry allows at most 100."
            exit 1
          fi
          # The registry proves crate ownership by finding this marker in the
          # README as crates.io renders it, which drops HTML comments and cannot
          # change after publish, so the marker must be visible text. An unclosed
          # comment runs to the end of the file, and like the registry's matcher
          # the name must not continue with a server-name character.
          mcp_name="$(jq -r '.name' server.json)"
          if ! MCP_NAME="$mcp_name" perl -0777 -e '$_ = <> // ""; s/<!--.*?(?:-->|\z)//gs; exit(/mcp-name: \Q$ENV{MCP_NAME}\E(?![A-Za-z0-9._\/-])/ ? 0 : 1)' README.md; then
            echo "::error::README.md lacks a visible 'mcp-name: $mcp_name' line (not inside an HTML comment); the MCP registry refuses the crate without it."
            exit 1
          fi
      - name: Scan Cargo dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # third_party/ holds vendored crates wired in through
          # [patch.crates-io]; cargo resolves them from the root Cargo.lock and
          # never reads their own lockfiles, so scanning those reports
          # packages nab does not build (#358).
          scan-args: |-
            --config=.github/osv-scanner.toml
            --recursive
            --experimental-exclude=third_party
            ./

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: test-${{ matrix.os }}
      - name: Run tests
        run: cargo test --locked --workspace
        env:
          NAB_NET_TESTS: "0"

  build:
    name: Build ${{ matrix.target }}
    needs: [test, security-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ''
            packages: ''
          - os: macos-14
            target: x86_64-apple-darwin
            suffix: ''
            packages: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            packages: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ''
            cross: true
            features: '--no-default-features --features cli,http3'
            packages: gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ''
            features: '--no-default-features --features cli,http3'
            packages: musl-tools
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: ''
            features: '--no-default-features --features cli,http3'
            packages: musl-tools
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
            features: '--no-default-features --features cli,http3'
            packages: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Rename binaries
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cp nab${{ matrix.suffix }} nab-${{ matrix.target }}${{ matrix.suffix }}
          if [ -f nab-mcp${{ matrix.suffix }} ]; then
            cp nab-mcp${{ matrix.suffix }} nab-mcp-${{ matrix.target }}${{ matrix.suffix }}
          fi

      - name: Upload nab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nab-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nab-${{ matrix.target }}${{ matrix.suffix }}

      - name: Upload nab-mcp artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nab-mcp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nab-mcp-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              cp "$dir"* release/ 2>/dev/null || true
            fi
          done
          cd release
          ls -la
          sha256sum nab-* > checksums-sha256.txt 2>/dev/null || shasum -a 256 nab-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release/nab-*
            release/checksums-sha256.txt

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: publish

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    # Gated on the crates.io publish, not just the earlier version checks:
    # a failed `cargo publish` must never leave the MCP registry pointing at
    # a version that doesn't actually exist on crates.io.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Stamp release version into server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg version "$VERSION" \
            '.version = $version
             | (.packages[] | select(.registryType == "cargo") | .version) = $version' \
            server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
