name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - name: Run tests
        run: cargo test --locked --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ''
            packages: ''
          - os: macos-14
            target: x86_64-apple-darwin
            suffix: ''
            packages: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            packages: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ''
            cross: true
            features: '--no-default-features --features cli,http3'
            packages: gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ''
            features: '--no-default-features --features cli,http3'
            packages: musl-tools
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: ''
            features: '--no-default-features --features cli,http3'
            packages: musl-tools
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
            features: '--no-default-features --features cli,http3'
            packages: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Rename binaries
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cp nab${{ matrix.suffix }} nab-${{ matrix.target }}${{ matrix.suffix }}
          if [ -f nab-mcp${{ matrix.suffix }} ]; then
            cp nab-mcp${{ matrix.suffix }} nab-mcp-${{ matrix.target }}${{ matrix.suffix }}
          fi

      - name: Upload nab artifact
        uses: actions/upload-artifact@v4
        with:
          name: nab-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nab-${{ matrix.target }}${{ matrix.suffix }}

      - name: Upload nab-mcp artifact
        uses: actions/upload-artifact@v4
        with:
          name: nab-mcp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nab-mcp-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              cp "$dir"* release/ 2>/dev/null || true
            fi
          done
          cd release
          ls -la
          sha256sum nab-* > checksums-sha256.txt 2>/dev/null || shasum -a 256 nab-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/nab-*
            release/checksums-sha256.txt

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
