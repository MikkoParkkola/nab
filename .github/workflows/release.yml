name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Release backstop for the dependency-vulnerability gate. ci.yml's `audit`
  # job runs `cargo audit` on every PR/push to main, but ci.yml does NOT run on
  # tags — so a `v*` tag push would otherwise reach the GitHub release and the
  # crates.io publish with zero vulnerability scanning. This job scans Cargo.lock
  # against OSV/RustSec at tag time and fails the release on any known fixable
  # vuln. It is BROADER than the PR-path `cargo audit`, which by default treats
  # unsound/unmaintained/yanked advisories as warnings (exit 0); osv-scanner
  # blocks on any fixable advisory. The `build` job (and the whole build ->
  # release -> publish DAG that `needs:`-es it) depends on this gate, so the
  # GitHub release and the crates.io publish both block if a fixable vuln is
  # present. Accepted/unfixable vulns are time-boxed in .github/osv-scanner.toml.
  security-gate:
    name: Security gate (block release on known vulns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify Cargo.toml version matches the tag
        # Guards against tagging a release whose Cargo.toml was not bumped: that
        # ships mis-versioned binaries and fails `cargo publish` with a
        # "version already exists" error (regression: v0.12.0 tag vs 0.11.0 Cargo.toml).
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Release tag v$tag does not match Cargo.toml version $ver. Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "version OK: tag v$tag == Cargo.toml $ver"
      - name: Scan Cargo dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=.github/osv-scanner.toml
            --recursive
            ./

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: test-${{ matrix.os }}
      - name: Run tests
        run: cargo test --locked --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: [test, security-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ''
            packages: ''
          - os: macos-14
            target: x86_64-apple-darwin
            suffix: ''
            packages: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            packages: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ''
            cross: true
            features: '--no-default-features --features cli,http3'
            packages: gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ''
            features: '--no-default-features --features cli,http3'
            packages: musl-tools
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: ''
            features: '--no-default-features --features cli,http3'
            packages: musl-tools
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
            features: '--no-default-features --features cli,http3'
            packages: ''

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Rename binaries
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cp nab${{ matrix.suffix }} nab-${{ matrix.target }}${{ matrix.suffix }}
          if [ -f nab-mcp${{ matrix.suffix }} ]; then
            cp nab-mcp${{ matrix.suffix }} nab-mcp-${{ matrix.target }}${{ matrix.suffix }}
          fi

      - name: Upload nab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nab-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nab-${{ matrix.target }}${{ matrix.suffix }}

      - name: Upload nab-mcp artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nab-mcp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nab-mcp-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              cp "$dir"* release/ 2>/dev/null || true
            fi
          done
          cd release
          ls -la
          sha256sum nab-* > checksums-sha256.txt 2>/dev/null || shasum -a 256 nab-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            release/nab-*
            release/checksums-sha256.txt

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: publish

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
