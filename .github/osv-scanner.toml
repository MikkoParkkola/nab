# osv-scanner allowlist — the pressure valve for the release security gate.
#
# The gate fails the build on ANY known, fixable vulnerability in the
# dependency tree. It runs in the release path:
#   - release.yml `security-gate` job -> backstop that blocks the release
#     (GitHub release + crates.io publish) if a known fixable vuln is present
#     at tag time.
#
# Scope (verified by local run 2026-06-05): crates.io packages — osv-scanner
# reads Cargo.lock and checks every locked dependency against OSV/RustSec. This
# is BROADER than the `cargo audit` job in ci.yml's CI Gate, which by default
# treats RustSec "unsound"/"unmaintained"/"yanked" advisories as warnings
# (exit 0) and only hard-fails on vulnerability-class advisories. osv-scanner
# fails on any fixable advisory regardless of class — so it catches fixable
# items (e.g. lru RUSTSEC-2026-0002, an unsoundness advisory with a patched
# release) that cargo audit lets through. cargo audit stays as the fast PR-path
# signal; this gate is the release backstop.
#
# NOT covered: github-actions advisories (our actions are SHA-pinned, which is
# itself the mitigation, and osv-scanner does not map SHA pins to advisory
# versions) and Docker base-image OS-layer CVEs (osv-scanner reads lockfiles,
# not image layers — that needs a separate trivy image scan, which is NOT wired
# here because the release path does not build or push a Docker image; the
# repo's Dockerfile is a local/build convenience only). This covers the primary
# attack surface: the Cargo dependency tree that .github/dependabot.yml's cargo
# updater watches.
#
# Failing on any fixable vuln is intentional: a new release must include the
# security fixes that are available. Dependabot PROPOSES the bump PR; this gate
# DISPOSES — it refuses to ship until the fix is merged.
#
# When a vulnerability has NO upstream fix yet, or is verified unreachable, it
# would otherwise block every release indefinitely. Add a time-boxed exception
# here instead of weakening the gate. Each entry MUST carry a reason and an
# ignoreUntil review date — expired entries re-trigger the gate automatically.
#
# Format (https://google.github.io/osv-scanner/configuration/):
#
#   [[IgnoredVulns]]
#   id = "RUSTSEC-2025-1234"
#   ignoreUntil = 2026-07-01   # review by this date; after it the gate fires again
#   reason = "No patched release upstream yet; tracked. Reviewed 2026-06-05 by <who>."
#
# Keep this list EMPTY unless a vuln genuinely has no fix. The right fix for a
# fixable vuln is to bump the dependency, not to ignore it.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
ignoreUntil = 2026-12-01   # review by this date; after it the gate fires again
reason = "bincode 2.0.1 is unmaintained (RUSTSEC-2025-0141, advisory class = unmaintained). Rechecked 2026-09-04: still no patched release (osv-scanner FIXED VERSION --). Transitive; not a code-execution vulnerability. Time-boxed pending upstream maintenance or a migration off bincode. Reviewed 2026-09-04 by Grok."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0222"
ignoreUntil = 2026-12-01
reason = "wasmtime 45.0.3 remains transitive through yara-x 1.20.0. Rechecked 2026-10-02: yara-x 1.21.0 still declares wasmtime 45.0.3 with cranelift and runtime only, and 45.0.3 is the last 45 release, so no patched 45 line exists. Direct optional wasmtime is 48.0.5, inside the patched >=47.0.3 line. CVSS 3.8, multiple engines, local high-privilege access and user interaction. Nab compiles its own built-in YARA rules. Tracked in #267. Reviewed 2026-10-02."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0269"
ignoreUntil = 2026-12-01
reason = "wasmtime-wasi filesystem sandbox escape. Direct wasmtime 48.0.5 is inside the patched >=47.0.4 line. Remaining lockfile hit is wasmtime 45.0.3 via yara-x 1.20.0. yara-x 1.21.0 still declares 45.0.3 and no patched 45 release exists. Cargo.lock has no wasmtime-wasi package. yara-x enables only cranelift and runtime. nab wasm-providers do not link a WASI filesystem. Fetched content is YARA scan input. Tracked in #267. Reviewed 2026-10-02."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0316"
ignoreUntil = 2026-12-01
reason = "Dynamic record lifting past the hostcall fuel limit. Patched lines start at 36.0.16, 48.0.3 and 49.0.1. No patched 45 release. Direct wasmtime is 48.0.5. Remaining hit is 45.0.3 via yara-x 1.20.0. yara-x 1.21.0 still declares wasmtime 45.0.3 with cranelift and runtime only, not component-model, which is where record lifting lives. The ignore is by advisory ID, so a later downgrade of the direct runtime below 48.0.3 would stay silent until this date. This excepts the yara copy. It does not patch it. Tracked in #267. Reviewed 2026-10-02."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0327"
ignoreUntil = 2026-12-01
reason = "Component async-lifted callback result count is unvalidated. Patched at >=48.0.4,<49 and >=49.0.2. Unaffected below 39.0.0. No patched 45 release. Direct wasmtime 48.0.5 is patched. Remaining hit is 45.0.3 via yara-x. yara-x 1.21.0 still declares 45.0.3 with cranelift and runtime only, not component-model. This excepts the yara copy. It does not patch it. An ID-wide ignore would also hide a direct-runtime downgrade below 48.0.4 until this date. Tracked in #267. Reviewed 2026-10-02."
